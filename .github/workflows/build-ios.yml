name: Build and Host Summertime Saga Web App
on:
  workflow_dispatch:

# Grant specific permissions to deploy an automated hosted page privately
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest # Uses an optimized Linux server (bypasses all Mac errors)
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Megatools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools

      - name: Download Ren'Py SDK From MEGA
        run: |
          # Pulls your exact Ren'Py package from your secure link
          megadl --path=renpy_sdk.tar.bz2 "https://mega.nz/file/WXBkERSY#_rqbt_cGSgfgVJQSNWKL9RGlZq4hgD8wz_Ox-nqBRoA"
          tar -xf renpy_sdk.tar.bz2

      - name: Download Game Files From MEGA
        run: |
          # Pulls your exact game package from your secure link
          megadl --path=game_files.zip "https://mega.nz/file/jTYDmRjA#DYkUcG8X3IQzV_0egKb9C6h9MriRK78DsvmTwgRGiYk"
          unzip -q game_files.zip -d ExtractedGame

      - name: Reconstruct Native Project Directory
        run: |
          # Standardizes the game source framework folders
          mkdir -p SummertimeSaga/game
          TARGET_APP=$(find ExtractedGame -maxdepth 2 -iname "summertimesaga.app" -print -quit)
          
          if [ -d "$TARGET_APP/Contents/Resources/autorun/game" ]; then
            cp -R "$TARGET_APP/Contents/Resources/autorun/game/"* SummertimeSaga/game/
          elif [ -d "$TARGET_APP/Contents/Resources/game" ]; then
            cp -R "$TARGET_APP/Contents/Resources/game/"* SummertimeSaga/game/
          fi

      - name: Build Web Application Package
        run: |
          SDK_DIR=$(ls -d renpy-*-sdk)
          # Compiles the game code directly into stable browser WebAssembly (wasm)
          ./$SDK_DIR/renpy.sh SummertimeSaga/ web_build --destination $GITHUB_WORKSPACE/web_out

      - name: Upload Web Artifact Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_out/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Web App to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
