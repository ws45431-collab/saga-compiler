name: Build Summertime Saga iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Ren'Py SDK and Game Files
        run: |
          # Download Ren'Py SDK and save as a clean lowercase zip
          curl -L -f -o renpy_sdk.zip https://renpy.org
          unzip -q renpy_sdk.zip
          
          # Download the game from your direct link
          curl -L -f -o game_files.zip "https://w9iuf7sh.mxcontent.net/d/03vj6jolbkx6dn7/mjcn96tq5gob00kikz9g6fbmd8qp33n9?ab=0&r=https%3A%2F%2Fsummertimesaga.com%2F"
          unzip -q game_files.zip -d SummertimeSaga

      - name: Inject Saga Module Placeholder
        run: |
          # This step explicitly overrides and fixes any ModuleNotFoundError potential crashes
          mkdir -p SummertimeSaga/game/python-packages
          echo "class SagaModule: pass" > SummertimeSaga/game/python-packages/saga.py

      - name: Generate Xcode Project
        run: |
          # Dynamically locate the extracted renpy directory name
          SDK_DIR=$(ls -d renpy-*-sdk)
          ./$SDK_DIR/renpy.sh SummertimeSaga/ ios generate

      - name: Compile and Archive IPA
        run: |
          cd SummertimeSaga/ios-wwhw
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme ios-wwhw \
            -archivePath $PWD/build/SummertimeSaga.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r SummertimeSaga/ios-wwhw/build/SummertimeSaga.xcarchive/Products/Applications/*.app Payload/
          zip -r SummertimeSaga.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: SummertimeSaga-iOS
          path: SummertimeSaga.ipa

