name: Build Summertime Saga iOS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Megatools on Mac Cloud
        run: |
          # Install megatools via Homebrew to handle secure MEGA downloads
          brew install megatools

      - name: Download Ren'Py SDK From MEGA
        run: |
          # Pulls your exact bzip2 Ren'Py package from your MEGA link
          megadl --path=renpy_sdk.tar.bz2 "https://mega.nz/file/WXBkERSY#_rqbt_cGSgfgVJQSNWKL9RGlZq4hgD8wz_Ox-nqBRoA"
          tar -xf renpy_sdk.tar.bz2

      - name: Download Game Files From MEGA
        run: |
          # Pulls your exact game package from your MEGA link
          megadl --path=game_files.zip "https://mega.nz/file/jTYDmRjA#DYkUcG8X3IQzV_0egKb9C6h9MriRK78DsvmTwgRGiYk"
          unzip -q game_files.zip -d ExtractedGame

      - name: Reconstruct Native Mobile Project Directory
        run: |
          # Create a clean Ren'Py project target structure
          mkdir -p SummertimeSaga/game
          
          # Locate the true .app bundle directory path
          TARGET_APP=$(find ExtractedGame -maxdepth 2 -iname "summertimesaga.app" -print -quit)
          
          # Copy core game assets from the bundle layout
          if [ -d "$TARGET_APP/Contents/Resources/autorun/game" ]; then
            cp -R "$TARGET_APP/Contents/Resources/autorun/game/"* SummertimeSaga/game/
          elif [ -d "$TARGET_APP/Contents/Resources/game" ]; then
            cp -R "$TARGET_APP/Contents/Resources/game/"* SummertimeSaga/game/
          fi

      - name: Extract Internal Mobile Python Modules
        run: |
          # Extract the game's actual native mobile frameworks from the compiled archives
          # This pulls the true, uncompromised saga modules built for mobile systems
          SDK_DIR=$(ls -d renpy-*-sdk)
          python3 ./$SDK_DIR/renpy.py SummertimeSaga/ rpa extract

      - name: Generate Xcode Project
        run: |
          SDK_DIR=$(ls -d renpy-*-sdk)
          ./$SDK_DIR/renpy.sh SummertimeSaga/ ios generate

      - name: Compile and Archive IPA via Xcode Engine
        run: |
          cd SummertimeSaga/ios-wwhw
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme ios-wwhw \
            -archivePath $PWD/build/SummertimeSaga.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r SummertimeSaga/ios-wwhw/build/SummertimeSaga.xcarchive/Products/Applications/*.app Payload/
          zip -r SummertimeSaga.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: SummertimeSaga-iOS
          path: SummertimeSaga.ipa
